# Tiny procedurally generated dataset for smoke tests / CI (CPU, ~1 minute).
# Exercises every v2 component with a small from-scratch encoder.
_base_: _base_.yaml

model:
  encoder: residual
  pretrained: false
  widths: [8, 16, 32, 64]
  transformer_dim: 32
  transformer_depth: 1
  transformer_heads: 4
  refine_train_points: 256
  refine_eval_points: 512

data:
  name: synthetic
  image_size: [64, 64]
  train_size: 128
  val_size: 32
  normalize: false

train:
  epochs: 3
  batch_size: 16
  eval_batch_size: 16
  num_workers: 0
  lr: 1.0e-3
  warmup_epochs: 0
  amp: false
  log_interval: 4
  early_stop_patience: 0
