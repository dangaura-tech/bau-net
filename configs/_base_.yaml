# Shared defaults (full BAU-Net v2). Dataset configs inherit from this file via `_base_`.
seed: 42
deterministic: false

model:
  in_channels: 3
  num_classes: 1
  encoder: resnet34            # residual | resnet18 | resnet34 | resnet50 | convnext_tiny
  pretrained: true
  widths: [32, 64, 128, 256, 512]   # residual encoder widths; widths[0] = full-resolution stem
  decoder_max_width: 256
  bottleneck: transformer      # conv | transformer (Global Context Transformer)
  transformer_dim: 256
  transformer_depth: 4
  transformer_heads: 8
  attention: true
  boundary_head: true
  sdf_head: true
  point_refine: true           # Uncertainty-guided Point Refinement
  refine_train_points: 2048
  refine_eval_points: 8192
  refine_boundary_weight: 1.0
  residual: true
  dropout: 0.1
  deep_supervision: true

loss:
  dice_weight: 1.0
  bce_weight: 1.0
  boundary_weight: 0.5
  boundary_width: 3
  sdf_weight: 0.5
  consistency_weight: 0.2
  consistency_kappa: 50.0
  point_weight: 1.0
  aux_weight: 0.4
  focal: false

data:
  image_size: [352, 352]
  augment: true
  normalize: true

train:
  epochs: 100
  batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 3
  min_lr_ratio: 0.01
  grad_clip: 1.0
  amp: true
  eval_interval: 1
  eval_hd95: false
  monitor: dice
  early_stop_patience: 20
  log_interval: 50
